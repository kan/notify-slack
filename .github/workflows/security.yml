name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 00:00 UTC (09:00 JST)
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The version is pinned in tools/go.mod and checked against go.sum.
      # -modfile keeps ./... on the root module.
      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...
