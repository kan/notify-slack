name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      # The release does not tidy (.goreleaser.yaml), so a forgotten tidy
      # stops here instead of shipping
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: Check scripts/tagpr/ against the tagpr workflow pin
        run: node scripts/tagpr/verify-subtree.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Here rather than in the test job: this job's cache is keyed on
      # tools/go.sum too
      - name: go mod tidy (tools)
        run: go mod tidy -C tools -diff
      # The version is pinned in tools/go.mod. -modfile keeps ./... on the
      # root module.
      - name: golangci-lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

  # .goreleaser.yaml is read only when a tag is released; check it on every
  # change instead
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/release/go.sum
      # tools/go.mod and tools/release/go.mod follow the root's go and
      # toolchain lines. Nothing raises them on their own (toolchain.yml reads
      # only the root, and a Dependabot update can add a toolchain line), and a
      # newer one would make the release or the tools fetch another toolchain
      # than setup-go installed.
      - name: go line of tools and tools/release
        run: |
          for mod in tools/go.mod tools/release/go.mod; do
            for line in go toolchain; do
              root="$(sed -n "s/^$line //p" go.mod)"
              tools="$(sed -n "s/^$line //p" "$mod")"
              if [ "$root" != "$tools" ]; then
                echo "::error::$mod has $line '$tools'; the root go.mod has $line '$root'"
                exit 1
              fi
            done
          done
      # Here rather than in the test job: this job's cache is keyed on
      # tools/release/go.sum
      - name: go mod tidy (tools/release)
        run: go mod tidy -C tools/release -diff
      - name: goreleaser check
        run: go tool -modfile=tools/release/go.mod goreleaser check
