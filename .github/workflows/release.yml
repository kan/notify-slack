name: release

# tagpr.yml starts this with workflow_dispatch on the tag it pushed (a tag
# pushed with GITHUB_TOKEN does not trigger push). The push trigger is for a
# tag pushed by hand. Either way github.ref is the tag, which the build
# provenance records.
#
# The work is done by kan/tagpr-scripts' shared workflows (copies in
# scripts/tagpr/.github/workflows/). What they check, their inputs and how to
# re-run them are in the tagpr-scripts README, "The Go release workflows".
#
# - build-go.yml checks the tag, its CHANGELOG section and CREDITS (read only),
#   then builds the archives with GoReleaser and attests them.
# - release-go.yml creates the release as a draft with the archives and
#   publishes it. Immutable releases are enabled, so once the release is
#   published its assets and tag cannot be changed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

# One run per tag. Not cancelled: a run stopped while publishing would leave
# a half-done release. The shared workflows have no concurrency of their own.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The SHAs are the tagpr-scripts commit pulled into scripts/tagpr/, the same
  # as tagpr.yml (verify-subtree.mjs checks these lines too).
  build:
    uses: kan/tagpr-scripts/.github/workflows/build-go.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: read
      id-token: write           # Sigstore signing certificate for attestations
      attestations: write       # Store the build provenance attestation
      artifact-metadata: write  # Storage record for the attested artifacts

  release:
    needs: build
    uses: kan/tagpr-scripts/.github/workflows/release-go.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: write  # Create and publish the release
    with:
      prerelease: ${{ needs.build.outputs.prerelease }}
