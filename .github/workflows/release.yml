name: release

# tagpr.yml starts this with workflow_dispatch on the tag it pushed (a tag
# pushed with GITHUB_TOKEN does not trigger push). The push trigger is for a
# tag pushed by hand. Either way github.ref is the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Each job lists what it needs
permissions:
  contents: read

# One run per tag. Not cancelled: a run stopped while publishing would leave
# a half-done release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the archives without the permission to write to the repository.
  build:
    # workflow_dispatch can be started on a branch; release only tags. The
    # publish job depends on this one, so this condition guards both.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # GoReleaser resolves the current and previous tags
          persist-credentials: false

      # The publish job makes the release notes from this section. Stop here,
      # before building, if the tag has none.
      - name: Check the CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/tagpr/release-notes.mjs "$TAG" > /dev/null

      # No cache: a cache written by another workflow must not reach the
      # released binaries.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Publishing is left to the publish job. The release notes come from
      # CHANGELOG.md there, not from GoReleaser.
      - name: build
        run: go tool goreleaser release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 1
          if-no-files-found: error

  # Creates the release from what the build job produced. Nothing is compiled
  # here.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the release
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # For scripts/tagpr/release-notes.mjs and CHANGELOG.md
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-dist
          path: dist

      # The CHANGELOG.md section of the version ("Unreleased" for a
      # pre-release); the build job has already checked it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/tagpr/release-notes.mjs "$TAG" > "$notes"
          gh release create "$TAG" --verify-tag --prerelease="$PRERELEASE" \
            --title "$TAG" --notes-file "$notes" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
