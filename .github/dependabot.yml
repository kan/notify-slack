version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Release tools (tools/release/go.mod: goreleaser, gocredits). A module of
  # its own so that they do not share a build list with the binary. Every
  # require there is `// indirect`, and Dependabot updates only direct ones
  # unless told, so name the tools.
  - package-ecosystem: gomod
    directory: "/tools/release"
    schedule:
      interval: weekly
    allow:
      - dependency-name: github.com/goreleaser/goreleaser/v2
        dependency-type: all
      - dependency-name: github.com/Songmu/gocredits
        dependency-type: all
    groups:
      release-tools:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # tagpr.yml が呼ぶ kan/tagpr-scripts の共通の workflow の SHA は、
      # scripts/tagpr/ の subtree と揃える。subtree pull と同じ PR でだけ上げ、
      # Dependabot には上げさせない（tagpr-scripts の README「The tagpr workflow」）。
      # 今はタグが無いので上げに来ないが、タグを打つと SHA だけ上げる PR が来る。
      - dependency-name: "kan/tagpr-scripts*"
    groups:
      github-actions:
        patterns:
          - "*"
